server:
  port: 8084

spring:
  application:
    name: ai-service
  main:
    web-application-type: reactive

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking.ai: DEBUG
    org.springframework.web: INFO

ai:
  model:
    default: gpt-3.5-turbo
    temperature: 0.7
    max-tokens: 1000
